name: Build desktop apps

# Builds installers for macOS (Intel + Apple Silicon), Windows and Linux.
# - every push to main  -> downloadable artifacts on the run
# - a v* tag            -> the same artifacts attached to a GitHub Release
# - manual run          -> artifacts only
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (arm64 + x64)
            args: --mac --arm64 --x64
          - os: windows-latest
            label: Windows (x64)
            args: --win --x64
          - os: ubuntu-latest
            label: Linux (x64)
            args: --linux --x64
    env:
      # The builds are unsigned; skip identity discovery so macOS never blocks on it.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - run: npm ci

      - name: Build renderer
        run: npm run build:desktop

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx electron . --no-sandbox
        env:
          ELECTRON_SMOKE_TEST: '1'

      - name: Package with electron-builder
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/**
            !release/*-unpacked/**
            !release/mac*/**
            !release/*.yml
            !release/*.yaml
            !release/*.blockmap

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false
